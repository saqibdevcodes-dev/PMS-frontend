name: pms-fe
services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports: ['127.0.0.1:3000:80']
    networks: [backend]
networks:
  backend:
    external: true
    name: ${PMS_DOCKER_NETWORK:-pms_default}
