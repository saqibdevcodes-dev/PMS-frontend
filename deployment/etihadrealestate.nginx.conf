# Host Nginx configuration. Enable this HTTP vhost first, then use Certbot
# to add HTTPS and redirect HTTP before running the deployment workflow.
server {
    listen 80;
    server_name etihadrealestate.tech;

    root /var/www/pms-frontend/current;
    index index.html;
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # The browser calls the existing HTTPS API directly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.etihadrealestate.tech; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    location /assets/ {
        # Keep older hashed bundles available across releases.
        alias /var/www/pms-frontend/assets/;
        expires 1y;
    }

    location = /version.json {
        try_files $uri =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
